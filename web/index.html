<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Automathink</title>
  <link rel="stylesheet" href="/brand.css">
  <style>
    header { background: var(--ink); color: var(--pearl); padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    header .biz { font-size: 14px; color: var(--pearl); opacity: .85; }
    header button { background: transparent; color: var(--pearl); border-color: var(--ink-3); }
    main { max-width: 1180px; margin: 0 auto; padding: 24px; }
    .period { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
    .period button.on { background: var(--ink); color: var(--pearl); border-color: var(--ink); }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .kpi { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
    .kpi.dark { background: var(--ink); border-color: var(--ink); color: var(--pearl); }
    .kpi .v { font-size: 30px; font-weight: 800; color: var(--sage-deep); line-height: 1.1; margin-top: 6px; }
    .kpi.dark .v { color: var(--sage); }
    .kpi .s { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .kpi.dark .s, .kpi.dark .eyebrow { color: var(--pearl); opacity: .8; }
    .note { font-size: 12px; color: var(--muted); margin: 8px 2px 22px; }
    nav.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
    nav.tabs button { border: 0; border-radius: 0; background: none; border-bottom: 2px solid transparent; }
    nav.tabs button.on { border-bottom-color: var(--ink); font-weight: 700; }
    .badge { display: inline-block; font-size: 11px; font-family: var(--mono); padding: 2px 8px; border-radius: 999px; background: var(--pearl); color: var(--ink); }
    .badge.handoff { background: #F6D8D3; color: var(--danger); }
    .badge.agent { background: var(--ink); color: var(--sage); }
    .split { display: grid; grid-template-columns: 340px 1fr; gap: 16px; min-height: 420px; }
    @media (max-width: 820px) { .split { grid-template-columns: 1fr; } }
    .list { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; max-height: 560px; }
    .item { padding: 12px 14px; border-bottom: 1px solid var(--pearl); cursor: pointer; }
    .item:hover, .item.on { background: var(--paper); }
    .item .who { font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
    .item .last { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
    .thread { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; }
    .thread .top { padding: 12px 16px; border-bottom: 1px solid var(--pearl); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .msgs { padding: 16px; overflow: auto; flex: 1; max-height: 440px; display: flex; flex-direction: column; gap: 8px; }
    .m { max-width: 78%; padding: 9px 12px; border-radius: 14px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; }
    .m.user { background: var(--pearl); align-self: flex-start; border-bottom-left-radius: 4px; }
    .m.assistant { background: var(--ink); color: var(--pearl); align-self: flex-end; border-bottom-right-radius: 4px; }
    .m .meta { display: block; font-family: var(--mono); font-size: 10px; opacity: .65; margin-top: 4px; }
    .compose { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--pearl); }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; font-size: 14px; }
    th { text-align: left; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--pearl); background: var(--ink); padding: 10px 12px; }
    td { padding: 10px 12px; border-top: 1px solid var(--pearl); vertical-align: top; }
    .empty { color: var(--muted); padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="logo" style="color:var(--pearl)"><span class="mark">A</span><span>Auto<b>Mathink</b></span></div>
    <div class="biz" id="biz"></div>
    <div style="display:flex;gap:8px"><a href="/chat.html" target="_blank"><button>Open chat</button></a><button id="logout">Sign out</button></div>
  </header>
  <main>
    <div class="period"><span class="eyebrow">Impact</span>
      <button data-days="7" class="on">7 days</button><button data-days="30">30 days</button><button data-days="90">90 days</button></div>
    <section class="kpis" id="kpis"></section>
    <div class="note" id="assumptions"></div>
    <nav class="tabs">
      <button data-tab="convs" class="on">Conversations</button><button data-tab="bookings">Bookings</button>
      <button data-tab="leads">Leads</button><button data-tab="alerts">Alerts <span id="unread"></span></button>
    </nav>
    <section id="tab"></section>
  </main>
  <script src="/panel.js"></script>
</body>
</html>
